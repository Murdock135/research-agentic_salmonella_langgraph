<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">SPARQ analytical workflow and dependency-aware task execution</title>
  <desc id="desc">A business-level workflow from user query through Planner, Executor, and Aggregator to a final report, with an expanded view of parallel and dependent task execution.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#354052"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B35C28"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #26313F; }
      .stage-title { font-size: 34px; font-weight: 700; }
      .stage-copy { font-size: 27px; }
      .panel-title { font-size: 34px; font-weight: 700; }
      .group-title { font-size: 27px; font-weight: 700; }
      .card-title { font-size: 27px; font-weight: 700; }
      .card-copy { font-size: 21px; }
      .small { font-size: 21px; }
      .report-title { font-size: 31px; font-weight: 700; }
      .workflow { fill: none; stroke: #354052; stroke-width: 3.5; marker-end: url(#arrow-dark); }
      .dependency { fill: none; stroke: #B35C28; stroke-width: 3.5; marker-end: url(#arrow-accent); }
      .result-line { fill: none; stroke: #354052; stroke-width: 3; }
      .stage { stroke: #667383; stroke-width: 2; }
      .worker { fill: #EAF3FC; stroke: #5689B7; stroke-width: 2; }
      .dependent-worker { fill: #F0EBFA; stroke: #806BA9; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1800" height="1080" fill="#FFFFFF"/>

  <!-- Main workflow -->
  <text x="70" y="58" class="panel-title">Main analytical workflow</text>

  <rect x="70" y="92" width="210" height="150" rx="18" fill="#F6F0E7" class="stage"/>
  <circle cx="175" cy="137" r="20" fill="#D6B98C"/>
  <path d="M137 205c5-29 18-44 38-44s33 15 38 44" fill="#D6B98C"/>
  <text x="175" y="226" text-anchor="middle" class="stage-title">User query</text>

  <rect x="365" y="92" width="300" height="150" rx="18" fill="#EAF3FC" class="stage"/>
  <text x="515" y="145" text-anchor="middle" class="stage-title">Planner</text>
  <text x="515" y="181" text-anchor="middle" class="stage-copy">Breaks the query</text>
  <text x="515" y="207" text-anchor="middle" class="stage-copy">into tasks</text>

  <rect x="750" y="77" width="330" height="180" rx="20" fill="#EEE8F8" stroke="#806BA9" stroke-width="3"/>
  <text x="915" y="139" text-anchor="middle" class="stage-title">Executor</text>
  <text x="915" y="178" text-anchor="middle" class="stage-copy">Coordinates task</text>
  <text x="915" y="204" text-anchor="middle" class="stage-copy">execution</text>
  <text x="915" y="236" text-anchor="middle" class="small" fill="#63527F">Expanded below</text>

  <rect x="1165" y="92" width="320" height="150" rx="18" fill="#EAF5EC" class="stage"/>
  <text x="1325" y="145" text-anchor="middle" class="stage-title">Aggregator</text>
  <text x="1325" y="181" text-anchor="middle" class="stage-copy">Combines analytical</text>
  <text x="1325" y="207" text-anchor="middle" class="stage-copy">findings</text>

  <rect x="1550" y="92" width="200" height="150" rx="18" fill="#F6F0E7" class="stage"/>
  <path d="M1626 116h54l20 20v60h-74z" fill="#FFFFFF" stroke="#A88149" stroke-width="3"/>
  <path d="M1680 116v22h20M1642 156h42M1642 174h42" fill="none" stroke="#A88149" stroke-width="3"/>
  <text x="1650" y="216" text-anchor="middle" class="report-title">Final</text>
  <text x="1650" y="240" text-anchor="middle" class="report-title">report</text>

  <path d="M280 167H365" class="workflow"/>
  <path d="M665 167H750" class="workflow"/>
  <path d="M1080 167H1165" class="workflow"/>
  <path d="M1485 167H1550" class="workflow"/>

  <!-- Expanded Executor -->
  <rect x="70" y="315" width="1660" height="700" rx="22" fill="#F8FAFC" stroke="#806BA9" stroke-width="2.5"/>
  <rect x="70" y="315" width="1660" height="62" rx="22" fill="#EEE8F8"/>
  <path d="M70 355v22h1660v-22" fill="#EEE8F8"/>
  <text x="100" y="355" class="panel-title">Expanded Executor: parallel and dependency-aware task execution</text>

  <!-- Input and coordination -->
  <rect x="95" y="560" width="210" height="115" rx="57" fill="#F6F0E7" stroke="#A88149" stroke-width="2"/>
  <text x="200" y="606" text-anchor="middle" class="card-title">Tasks ready</text>
  <text x="200" y="631" text-anchor="middle" class="card-title">to run</text>

  <rect x="340" y="542" width="220" height="151" rx="20" fill="#EEE8F8" stroke="#806BA9" stroke-width="2.5"/>
  <text x="450" y="603" text-anchor="middle" class="card-title">Task</text>
  <text x="450" y="630" text-anchor="middle" class="card-title">coordination</text>
  <text x="450" y="658" text-anchor="middle" class="small">Dispatches</text>
  <text x="450" y="683" text-anchor="middle" class="small">ready work</text>
  <path d="M305 617H340" class="workflow"/>

  <!-- Parallel workers -->
  <rect x="590" y="405" width="390" height="500" rx="18" fill="none" stroke="#5689B7" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="785" y="440" text-anchor="middle" class="group-title">Tasks performed in parallel</text>

  <g>
    <rect x="615" y="463" width="350" height="124" rx="14" class="worker"/>
    <text x="650" y="497" class="card-title">Worker A</text>
    <text x="650" y="523" class="card-copy">Task instructions · Data context</text>
    <text x="650" y="547" class="card-copy">Analytical tools</text>
    <text x="650" y="571" class="card-copy">Private workspace</text>
  </g>
  <g>
    <rect x="615" y="603" width="350" height="124" rx="14" class="worker"/>
    <text x="650" y="637" class="card-title">Worker B</text>
    <text x="650" y="663" class="card-copy">Task instructions · Data context</text>
    <text x="650" y="687" class="card-copy">Analytical tools</text>
    <text x="650" y="711" class="card-copy">Private workspace</text>
  </g>
  <g>
    <rect x="615" y="743" width="350" height="124" rx="14" class="worker"/>
    <text x="650" y="777" class="card-title">Worker C</text>
    <text x="650" y="803" class="card-copy">Task instructions · Data context</text>
    <text x="650" y="827" class="card-copy">Analytical tools</text>
    <text x="650" y="851" class="card-copy">Private workspace</text>
  </g>

  <path d="M560 617H580V525H615" class="workflow"/>
  <path d="M560 617H615" class="workflow"/>
  <path d="M560 617H580V805H615" class="workflow"/>

  <!-- Selective dependency handoff -->
  <rect x="995" y="567" width="240" height="104" rx="16" fill="#EAF5EC" stroke="#668D70" stroke-width="2.5"/>
  <text x="1115" y="607" text-anchor="middle" class="card-title">Relevant outputs</text>
  <text x="1115" y="638" text-anchor="middle" class="card-title">from earlier tasks</text>
  <path d="M965 525H980V595H995" class="dependency"/>
  <path d="M965 665H995" class="dependency"/>

  <!-- Dependent workers -->
  <rect x="1250" y="445" width="350" height="420" rx="18" fill="none" stroke="#806BA9" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="1425" y="480" text-anchor="middle" class="group-title">Dependent tasks</text>

  <g>
    <rect x="1265" y="497" width="320" height="161" rx="14" class="dependent-worker"/>
    <text x="1280" y="531" class="card-title">Dependent worker A</text>
    <text x="1280" y="560" class="card-copy">Task instructions · Data context</text>
    <text x="1280" y="585" class="card-copy">Analytical tools</text>
    <text x="1280" y="610" class="card-copy">Private workspace</text>
    <text x="1280" y="635" class="card-copy" fill="#8E4D24">Relevant earlier results</text>
  </g>
  <g>
    <rect x="1265" y="667" width="320" height="161" rx="14" class="dependent-worker"/>
    <text x="1280" y="701" class="card-title">Dependent worker B</text>
    <text x="1280" y="730" class="card-copy">Task instructions · Data context</text>
    <text x="1280" y="755" class="card-copy">Analytical tools</text>
    <text x="1280" y="780" class="card-copy">Private workspace</text>
    <text x="1280" y="805" class="card-copy" fill="#8E4D24">Relevant earlier results</text>
  </g>
  <path d="M1235 619H1245V578H1265" class="dependency"/>
  <path d="M1235 619H1245V748H1265" class="dependency"/>

  <!-- Result collection -->
  <rect x="680" y="915" width="205" height="58" rx="14" fill="#EAF5EC" stroke="#668D70" stroke-width="2"/>
  <text x="782" y="951" text-anchor="middle" class="small">Parallel results</text>
  <path d="M782 905V920" class="workflow"/>

  <rect x="1310" y="875" width="200" height="58" rx="14" fill="#EAF5EC" stroke="#668D70" stroke-width="2"/>
  <text x="1410" y="911" text-anchor="middle" class="small">Dependent results</text>
  <path d="M1410 865V880" class="workflow"/>

  <rect x="1580" y="890" width="120" height="96" rx="16" fill="#EAF5EC" stroke="#668D70" stroke-width="2.5"/>
  <text x="1640" y="929" text-anchor="middle" class="card-title">Task</text>
  <text x="1640" y="955" text-anchor="middle" class="card-title">results</text>
  <path d="M870 944H1545V955H1580" class="workflow"/>
  <path d="M1500 904H1580" class="workflow"/>

  <!-- Explicit output path to the Aggregator -->
  <path d="M1700 938H1714V284H1325V242" class="workflow"/>
  <rect x="1560" y="272" width="170" height="46" rx="10" fill="#FFFFFF" stroke="#667383" stroke-width="1.5"/>
  <text x="1645" y="301" text-anchor="middle" class="small">Completed results</text>
</svg>
