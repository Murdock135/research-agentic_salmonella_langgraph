<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img" aria-labelledby="title desc">
  <title id="title">SPARQ: dependency-aware agentic analysis</title>
  <desc id="desc">Two-panel architecture diagram showing SPARQ's conditional system graph and its dependency-aware parallel executor.</desc>
  <defs>
    <style>
      text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; fill: #263238; }
      .panel-title { font-size: 26px; font-weight: 700; letter-spacing: .2px; }
      .node-title { font-size: 20px; font-weight: 700; }
      .label { font-size: 16px; }
      .small { font-size: 14px; }
      .tiny { font-size: 12px; }
      .muted { fill: #5d6770; }
      .box { stroke: #53606a; stroke-width: 1.5; }
      .agent { fill: #dcecf4; }
      .emphasis { fill: #cee4f0; stroke-width: 2.2; }
      .control { fill: #e7e0f2; }
      .resource { fill: #dfedde; }
      .human { fill: #f3e8d8; }
      .white { fill: #fff; }
      .flow { fill: none; stroke: #34424c; stroke-width: 2.2; marker-end: url(#arrow-dark); }
      .dependency { fill: none; stroke: #725b9a; stroke-width: 3; marker-end: url(#arrow-violet); }
      .tools { fill: none; stroke: #7b858c; stroke-width: 1.8; stroke-dasharray: 7 6; marker-start: url(#arrow-gray); marker-end: url(#arrow-gray); }
      .curates { fill: none; stroke: #b27b45; stroke-width: 2; stroke-dasharray: 2 7; marker-end: url(#arrow-warm); }
      .divider { stroke: #c7cdd1; stroke-width: 1.4; }
    </style>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#34424c"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#725b9a"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7b858c"/></marker>
    <marker id="arrow-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b27b45"/></marker>
  </defs>

  <rect width="1800" height="1280" fill="#fff"/>

  <!-- Panel A -->
  <text x="70" y="58" class="panel-title">A  SPARQ system graph</text>
  <rect x="70" y="112" width="130" height="78" rx="39" class="box human"/>
  <text x="135" y="158" text-anchor="middle" class="node-title">User query</text>

  <rect x="260" y="100" width="175" height="102" rx="14" class="box agent"/>
  <text x="347" y="142" text-anchor="middle" class="node-title">Router</text>
  <text x="347" y="172" text-anchor="middle" class="label muted">classify</text>

  <rect x="510" y="92" width="205" height="118" rx="14" class="box agent emphasis"/>
  <text x="612" y="137" text-anchor="middle" class="node-title">Planner</text>
  <text x="612" y="169" text-anchor="middle" class="label muted">produce typed plan</text>

  <rect x="790" y="92" width="220" height="118" rx="14" class="box control emphasis"/>
  <text x="900" y="137" text-anchor="middle" class="node-title">Executor</text>
  <text x="900" y="169" text-anchor="middle" class="label muted">run dependency waves</text>

  <rect x="1085" y="100" width="215" height="102" rx="14" class="box agent"/>
  <text x="1192" y="142" text-anchor="middle" class="node-title">Aggregator</text>
  <text x="1192" y="172" text-anchor="middle" class="label muted">synthesize results</text>

  <rect x="1375" y="100" width="205" height="102" rx="14" class="box agent"/>
  <text x="1477" y="142" text-anchor="middle" class="node-title">Saver</text>
  <text x="1477" y="172" text-anchor="middle" class="label muted">write answer artifact</text>

  <rect x="1640" y="112" width="100" height="78" rx="39" class="box human"/>
  <text x="1690" y="158" text-anchor="middle" class="node-title">Answer</text>

  <path d="M200 151 H260" class="flow"/><path d="M435 151 H510" class="flow"/>
  <text x="470" y="139" text-anchor="middle" class="small muted">analytical</text>
  <path d="M715 151 H790" class="flow"/><path d="M1010 151 H1085" class="flow"/>
  <path d="M1300 151 H1375" class="flow"/><path d="M1580 151 H1640" class="flow"/>
  <path d="M347 100 V76 H1477 V100" class="flow"/>
  <text x="910" y="67" text-anchor="middle" class="small muted">directly answerable · Router supplies answer</text>

  <!-- explicit Executor expansion -->
  <path d="M900 210 V276" class="flow"/>
  <text x="918" y="251" class="small muted">expand</text>
  <line x1="70" y1="260" x2="1740" y2="260" class="divider"/>

  <!-- Panel B -->
  <text x="70" y="315" class="panel-title">B  Dependency-aware parallel execution</text>
  <rect x="70" y="350" width="310" height="245" rx="14" class="box white"/>
  <rect x="70" y="350" width="310" height="48" rx="14" class="box control"/>
  <rect x="71" y="382" width="308" height="16" fill="#e7e0f2"/>
  <text x="95" y="381" class="node-title">Typed plan</text>
  <text x="95" y="427" class="small">Ordered steps</text>
  <text x="95" y="457" class="small muted">ID + description</text>
  <text x="95" y="485" class="small muted">selected datasets + rationale</text>
  <text x="95" y="513" class="small muted">task types</text>
  <text x="95" y="541" class="small muted">declared dependency IDs</text>
  <rect x="93" y="557" width="264" height="24" rx="12" fill="#f0edf6"/>
  <text x="225" y="574" text-anchor="middle" class="tiny">Planner → Executor</text>

  <rect x="455" y="378" width="290" height="180" rx="14" class="box control"/>
  <text x="600" y="419" text-anchor="middle" class="node-title">Ready-step scheduler</text>
  <text x="600" y="450" text-anchor="middle" class="small muted">programmatic executor logic</text>
  <line x1="482" y1="470" x2="718" y2="470" class="divider"/>
  <text x="600" y="498" text-anchor="middle" class="small">incomplete + dependencies satisfied</text>
  <text x="600" y="527" text-anchor="middle" class="small">dispatch current wave concurrently</text>
  <path d="M380 473 H455" class="flow"/>

  <!-- worker A -->
  <rect x="835" y="344" width="315" height="215" rx="14" class="box agent"/>
  <text x="860" y="379" class="node-title">Worker A</text>
  <text x="1123" y="378" text-anchor="end" class="small muted">independent</text>
  <rect x="858" y="397" width="269" height="38" rx="8" class="box white"/>
  <text x="993" y="422" text-anchor="middle" class="small">Step-specific instructions</text>
  <rect x="858" y="446" width="129" height="38" rx="8" class="box resource"/>
  <text x="923" y="471" text-anchor="middle" class="small">Data context</text>
  <rect x="998" y="446" width="129" height="38" rx="8" class="box white"/>
  <text x="1062" y="471" text-anchor="middle" class="small">Analysis tools</text>
  <rect x="858" y="495" width="164" height="42" rx="8" class="box control"/>
  <text x="940" y="521" text-anchor="middle" class="small">Private namespace A</text>
  <rect x="1033" y="495" width="94" height="42" rx="8" class="box resource"/>
  <text x="1080" y="521" text-anchor="middle" class="small">StepResult</text>

  <!-- worker B -->
  <rect x="835" y="590" width="315" height="215" rx="14" class="box agent"/>
  <text x="860" y="625" class="node-title">Worker B</text>
  <text x="1123" y="624" text-anchor="end" class="small muted">independent</text>
  <rect x="858" y="643" width="269" height="38" rx="8" class="box white"/>
  <text x="993" y="668" text-anchor="middle" class="small">Step-specific instructions</text>
  <rect x="858" y="692" width="129" height="38" rx="8" class="box resource"/>
  <text x="923" y="717" text-anchor="middle" class="small">Data context</text>
  <rect x="998" y="692" width="129" height="38" rx="8" class="box white"/>
  <text x="1062" y="717" text-anchor="middle" class="small">Analysis tools</text>
  <rect x="858" y="741" width="164" height="42" rx="8" class="box control"/>
  <text x="940" y="767" text-anchor="middle" class="small">Private namespace B</text>
  <rect x="1033" y="741" width="94" height="42" rx="8" class="box resource"/>
  <text x="1080" y="767" text-anchor="middle" class="small">StepResult</text>

  <!-- dispatch fanout -->
  <path d="M745 445 H790 V452 H835" class="flow"/>
  <path d="M745 492 H790 V698 H835" class="flow"/>
  <text x="792" y="432" text-anchor="middle" class="small muted">ready wave</text>

  <!-- dependent worker -->
  <rect x="1290" y="455" width="390" height="270" rx="14" class="box agent emphasis"/>
  <text x="1317" y="492" class="node-title">Dependent worker</text>
  <text x="1652" y="491" text-anchor="end" class="small muted">next ready wave</text>
  <rect x="1317" y="511" width="336" height="38" rx="8" class="box white"/>
  <text x="1485" y="536" text-anchor="middle" class="small">Step-specific instructions</text>
  <rect x="1317" y="561" width="336" height="48" rx="8" class="box resource"/>
  <text x="1485" y="581" text-anchor="middle" class="small">Declared upstream StepResults</text>
  <text x="1485" y="599" text-anchor="middle" class="tiny muted">only A + B in this example</text>
  <rect x="1317" y="621" width="160" height="42" rx="8" class="box resource"/>
  <text x="1397" y="647" text-anchor="middle" class="small">Data context</text>
  <rect x="1490" y="621" width="163" height="42" rx="8" class="box white"/>
  <text x="1571" y="647" text-anchor="middle" class="small">Analysis tools</text>
  <rect x="1317" y="676" width="218" height="32" rx="8" class="box control"/>
  <text x="1426" y="697" text-anchor="middle" class="small">New namespace ← A + B only</text>
  <rect x="1548" y="676" width="105" height="32" rx="8" class="box resource"/>
  <text x="1600" y="697" text-anchor="middle" class="small">StepResult</text>

  <!-- declared dependency propagation -->
  <path d="M1150 516 H1208 V573 H1290" class="dependency"/>
  <path d="M1150 762 H1208 V604 H1290" class="dependency"/>
  <text x="1217" y="547" class="small" fill="#725b9a">declared results +</text>
  <text x="1217" y="567" class="small" fill="#725b9a">namespace state</text>

  <!-- completed results and loop -->
  <rect x="1290" y="780" width="390" height="74" rx="14" class="box resource"/>
  <text x="1485" y="811" text-anchor="middle" class="node-title">Completed step results</text>
  <text x="1485" y="837" text-anchor="middle" class="small muted">typed collection → Aggregator</text>
  <path d="M1485 725 V780" class="dependency"/>
  <path d="M1290 817 H1218 V884 H600 V558" class="flow"/>
  <text x="905" y="875" text-anchor="middle" class="small muted">update state · repeat for successive ready waves</text>

  <!-- Supporting components -->
  <line x1="70" y1="925" x2="1740" y2="925" class="divider"/>
  <text x="70" y="968" class="panel-title">Supporting context, capabilities, and outputs</text>

  <!-- human and catalogue -->
  <circle cx="112" cy="1068" r="30" class="box human"/>
  <path d="M72 1130 Q112 1085 152 1130" class="box human"/>
  <text x="112" y="1162" text-anchor="middle" class="small">Domain expert</text>
  <text x="112" y="1182" text-anchor="middle" class="tiny muted">outside runtime</text>
  <rect x="225" y="1002" width="330" height="188" rx="14" class="box resource"/>
  <text x="250" y="1038" class="node-title">Dataset catalogue</text>
  <text x="250" y="1072" class="small">Dataset manifest + summaries</text>
  <text x="250" y="1101" class="small muted">schema and meaning</text>
  <text x="250" y="1128" class="small muted">loading guidance + known quirks</text>
  <text x="250" y="1162" class="tiny muted">loaded by Planner; passed as DataContext</text>
  <path d="M152 1095 H225" class="curates"/><text x="188" y="1085" text-anchor="middle" class="tiny" fill="#9a6738">curates</text>
  <path d="M390 1002 H45 V230 H612 V210" class="flow"/><text x="225" y="220" text-anchor="middle" class="tiny muted">Planner reads catalogue</text>
  <path d="M555 1095 H795 V717 H858" class="flow"/><text x="684" y="1083" text-anchor="middle" class="tiny muted">data context</text>

  <!-- analysis environment -->
  <rect x="670" y="1002" width="420" height="188" rx="14" class="box white"/>
  <text x="695" y="1038" class="node-title">Analysis environment</text>
  <rect x="695" y="1055" width="175" height="43" rx="8" class="box resource"/><text x="782" y="1082" text-anchor="middle" class="small">Data access</text>
  <rect x="885" y="1055" width="180" height="43" rx="8" class="box control"/><text x="975" y="1082" text-anchor="middle" class="small">Python subprocess</text>
  <rect x="695" y="1112" width="175" height="43" rx="8" class="box control"/><text x="782" y="1139" text-anchor="middle" class="small">Per-step namespace</text>
  <rect x="885" y="1112" width="180" height="43" rx="8" class="box resource"/><text x="975" y="1139" text-anchor="middle" class="small">Generated files</text>
  <text x="880" y="1178" text-anchor="middle" class="tiny muted">workspace-scoped execution</text>
  <path d="M993 805 V980 H880 V1002" class="tools"/><text x="1011" y="953" class="tiny muted">call ↔ result</text>

  <!-- persistence -->
  <rect x="1205" y="1002" width="475" height="188" rx="14" class="box resource"/>
  <text x="1230" y="1038" class="node-title">Run artifacts</text>
  <rect x="1230" y="1055" width="130" height="94" rx="8" class="box white"/>
  <text x="1295" y="1091" text-anchor="middle" class="small">Run trace</text>
  <text x="1295" y="1117" text-anchor="middle" class="tiny muted">runtime stream</text>
  <rect x="1375" y="1055" width="130" height="94" rx="8" class="box white"/>
  <text x="1440" y="1082" text-anchor="middle" class="small">Concise final</text>
  <text x="1440" y="1102" text-anchor="middle" class="small">answer</text>
  <text x="1440" y="1128" text-anchor="middle" class="tiny muted">Saver</text>
  <rect x="1520" y="1055" width="135" height="94" rx="8" class="box white"/>
  <text x="1587" y="1082" text-anchor="middle" class="small">Completed-run</text>
  <text x="1587" y="1102" text-anchor="middle" class="small">record</text>
  <text x="1587" y="1128" text-anchor="middle" class="tiny muted">run wrapper</text>
  <rect x="1218" y="945" width="180" height="38" rx="19" class="box white"/>
  <text x="1308" y="970" text-anchor="middle" class="small">Run wrapper</text>
  <text x="1435" y="970" class="tiny muted">streams states · finalizes run</text>
  <path d="M1280 983 V1022 H1295 V1055" class="flow"/>
  <path d="M1336 983 V1018 H1587 V1055" class="flow"/>
  <path d="M1580 177 H1738 V995 H1440 V1055" class="flow"/><text x="1660" y="988" text-anchor="middle" class="tiny muted">Saver writes</text>

  <text x="70" y="1245" class="tiny muted">Solid dark: control flow   ·   Solid violet: declared dependency / step-result propagation   ·   Dashed gray: tool call and return   ·   Dotted warm: curation</text>
</svg>
